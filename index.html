<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tally — Prop Trading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --bg-alt: #16171a;
    --card: #1a1b1f;
    --card-border: #2a2b30;
    --hairline: #26272c;
    --amber: #d4a24c;
    --amber-soft: rgba(212,162,76,0.14);
    --amber-dim: #8f7238;
    --green: #5aa579;
    --green-dim: #22302a;
    --red: #c1553d;
    --red-dim: #33241f;
    --text: #ece9e2;
    --text-mid: #a7a6a2;
    --text-dim: #6f6e73;
    --radius: 4px;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(212,162,76,0.05), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(90,165,121,0.03), transparent 55%),
      var(--bg);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { background: none; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  ::selection { background: var(--amber-dim); color: #fff; }
  a { color: var(--amber); }
  button { cursor: pointer; font-family: inherit; }

  /* ---- Top bar ---- */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding-top: 14px;
    background: linear-gradient(180deg, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--hairline);
    backdrop-filter: blur(6px);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 0 20px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon { flex-shrink: 0; display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
  .brand-mark { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(120deg, #f3d9a4, var(--amber) 60%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-sub { font-size: 11px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; }

  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select#accountSelect {
    background: var(--card); color: var(--text); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 8px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
    max-width: 230px;
  }
  .btn {
    background: var(--card); color: var(--text); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 8px 14px; font-size: 13px; font-weight: 500;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .btn:hover { border-color: var(--amber-dim); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--amber); outline-offset: 1px;
  }
  .btn-primary { background: linear-gradient(160deg, #e3ba71, var(--amber)); color: #1c1508; border-color: var(--amber); font-weight: 600; box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 6px 16px rgba(212,162,76,0.18); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-mid); }
  .btn-ghost:hover { color: var(--text); border-color: var(--card-border); }
  .btn-danger { color: var(--red); }
  .icon-round { width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 15px; }

  /* ---- Section nav ---- */
  .section-nav { max-width: 1180px; margin: 0 auto; padding: 4px 20px 0; display: flex; gap: 4px; }
  .tab-btn {
    background: none; border: none; color: var(--text-dim); padding: 9px 4px; margin-right: 22px;
    font-size: 13.5px; font-weight: 500; position: relative; letter-spacing: 0.01em;
  }
  .tab-btn.active { color: var(--text); }
  .tab-btn.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, var(--amber), transparent);
  }
  .tab-btn:hover { color: var(--text); }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 80px; }

  /* ---- Empty state ---- */
  .empty-state { text-align: center; padding: 90px 20px; color: var(--text-mid); }
  .empty-state h2 { color: var(--text); font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  .empty-state p { max-width: 400px; margin: 0 auto 22px; font-size: 14px; line-height: 1.6; }

  /* ---- Compliance ribbon ---- */
  .ribbon {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--hairline); border: 1px solid var(--hairline); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 28px rgba(0,0,0,0.28);
  }
  @media (max-width: 760px) { .ribbon { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .ribbon { grid-template-columns: repeat(1, 1fr); } }
  .ribbon-cell { background: var(--card); padding: 16px 18px; position: relative; }
  .ribbon-cell::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--amber-soft), transparent); opacity: 0.7; }
  .ribbon-label { font-size: 10.5px; color: var(--text-dim); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.08em; }
  .ribbon-value { font-family: 'IBM Plex Mono', monospace; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .ribbon-sub { font-size: 11px; color: var(--text-dim); margin-top: 5px; font-family: 'IBM Plex Mono', monospace; }
  .gauge-track { height: 4px; background: var(--bg-alt); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 2px; transition: width .3s ease; }
  .pos { color: var(--green); } .neg { color: var(--red); } .warn-text { color: var(--amber); }
  .badge-reached { display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-size: 13px; font-weight: 600; }

  .alert-banner {
    display: flex; gap: 14px; align-items: flex-start; background: var(--red-dim);
    border: 1px solid rgba(193,85,61,0.35); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  }
  .alert-icon { font-size: 20px; line-height: 1; margin-top: 1px; }
  .alert-title { font-size: 13.5px; font-weight: 600; color: #f0a893; margin: 0 0 5px; }
  .alert-body { font-size: 12.5px; color: var(--text-mid); line-height: 1.6; margin: 0 0 8px; }
  .alert-fix { font-size: 12.5px; color: var(--text); line-height: 1.6; background: rgba(0,0,0,0.15); border-radius: var(--radius); padding: 10px 12px; }
  .alert-fix b { color: var(--amber); font-family: 'IBM Plex Mono', monospace; }
  .alert-banner.warn { background: rgba(212,162,76,0.12); border-color: rgba(212,162,76,0.32); }
  .alert-banner.warn .alert-title { color: var(--amber); }

  .week-summary {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px; border-bottom: 1px solid var(--hairline);
    font-size: 11.5px; color: var(--text-dim);
  }
  .week-summary b { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 22px rgba(0,0,0,0.22); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--hairline); }
  .panel-head h3 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }
  .panel-body { padding: 18px; }

  .chart-wrap { padding: 6px 12px 14px; }
  svg#equityChart { width: 100%; height: 170px; display: block; }

  /* ---- Calendar ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--hairline); }
  .cal-nav { display: flex; align-items: center; gap: 4px; }
  .cal-navbtn { background: var(--bg-alt); border: 1px solid var(--card-border); color: var(--text-mid); border-radius: var(--radius); width: 28px; height: 28px; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
  .cal-navbtn:hover { color: var(--text); border-color: var(--amber-dim); }
  .cal-month-label { font-size: 13px; font-weight: 600; min-width: 130px; text-align: center; }
  .cal-summary { font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .cal-body { padding: 14px 18px 18px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cal-weekdays span { text-align: center; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-cell {
    position: relative; border-radius: var(--radius); border: 1px solid var(--card-border);
    background: var(--bg-alt); min-height: 62px; padding: 6px 7px; cursor: pointer;
    transition: border-color .12s ease, transform .1s ease;
  }
  .cal-cell:hover { border-color: var(--amber-dim); transform: translateY(-1px); }
  .cal-cell.empty { visibility: hidden; cursor: default; }
  .cal-cell.win { background: var(--green-dim); border-color: rgba(90,165,121,0.22); }
  .cal-cell.loss { background: var(--red-dim); border-color: rgba(193,85,61,0.22); }
  .cal-cell.today { box-shadow: 0 0 0 1px var(--amber) inset; }
  .cal-daynum { font-size: 10.5px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .cal-cell.win .cal-daynum, .cal-cell.loss .cal-daynum { color: var(--text-mid); }
  .cal-pnl { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; margin-top: 6px; white-space: nowrap; }
  .cal-cell.win .cal-pnl { color: var(--green); }
  .cal-cell.loss .cal-pnl { color: var(--red); }
  .cal-count { position: absolute; bottom: 5px; right: 6px; font-size: 9.5px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .day-trade-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; cursor: pointer; }
  .day-trade-row:last-child { border-bottom: none; }
  .day-trade-row:hover { color: var(--amber); }
  .day-trade-left { display: flex; align-items: center; gap: 8px; }

  .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hairline); }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .k { font-size: 12.5px; color: var(--text-mid); }
  .stat-row .v { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; font-weight: 500; }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-bar select, .filter-bar input[type="text"] {
    background: var(--bg-alt); color: var(--text); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 6px 9px; font-size: 12.5px; font-family: 'IBM Plex Mono', monospace;
  }

  .table-scroll { overflow-x: auto; }
  table.trades { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
  table.trades th { text-align: left; font-weight: 500; color: var(--text-dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  table.trades td { padding: 11px 14px; border-bottom: 1px solid var(--hairline); white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  table.trades tbody tr { transition: background .12s ease; cursor: pointer; }
  table.trades tbody tr:hover { background: var(--bg-alt); }
  table.trades tbody tr:last-child td { border-bottom: none; }
  .dir-pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .dir-long { background: var(--green-dim); color: var(--green); }
  .dir-short { background: var(--red-dim); color: #e08770; }
  .tag-pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; background: var(--bg-alt); color: var(--text-mid); border: 1px solid var(--card-border); }
  .bt-pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10.5px; background: rgba(122,144,214,0.12); color: #93a5e0; border: 1px solid rgba(122,144,214,0.25); font-family: 'IBM Plex Mono', monospace; }
  .tag-eval { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; background: rgba(212,162,76,0.16); color: var(--amber); border: 1px solid rgba(212,162,76,0.3); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
  .tag-funded { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; background: rgba(122,180,214,0.16); color: #7ab4d6; border: 1px solid rgba(122,180,214,0.3); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; }
  .cal-phase-tag { position: absolute; top: 4px; right: 5px; font-size: 7.5px; padding: 1px 4px; border-radius: 6px; font-weight: 700; letter-spacing: 0.03em; font-family: 'IBM Plex Mono', monospace; }
  .cal-phase-tag.eval { background: rgba(212,162,76,0.22); color: var(--amber); }
  .cal-phase-tag.funded { background: rgba(122,180,214,0.22); color: #7ab4d6; }
  .cal-phase-tag.mixed { background: rgba(160,160,165,0.22); color: var(--text-mid); }
  .row-actions { display: flex; gap: 6px; opacity: 0; transition: opacity .12s; }
  table.trades tbody tr:hover .row-actions { opacity: 1; }
  .icon-btn { background: none; border: none; color: var(--text-dim); font-size: 13px; padding: 2px 4px; }
  .icon-btn:hover { color: var(--text); }

  /* ---- Card grids (strategies / indicators) ---- */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .content-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 16px 18px; cursor: pointer; transition: border-color .15s ease, transform .1s ease;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .content-card:hover { border-color: var(--amber-dim); }
  .content-card h4 { margin: 0 0 8px; font-size: 14.5px; font-weight: 600; }
  .content-card p { margin: 0 0 10px; font-size: 12.5px; color: var(--text-mid); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .content-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .content-card .ind-link { font-size: 12px; color: var(--amber); text-decoration: none; }
  .content-card .ind-link:hover { text-decoration: underline; }
  .section-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .section-toolbar h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .section-desc { color: var(--text-dim); font-size: 12.5px; margin: -10px 0 18px; }

  /* ---- Modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(6,6,7,0.72); backdrop-filter: blur(3px);
    display: flex; align-items: flex-start; justify-content: center; z-index: 100;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal {
    background: var(--bg-alt); border: 1px solid var(--card-border); border-radius: var(--radius);
    width: 100%; max-width: 620px; margin: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--hairline); }
  .modal-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal-body { padding: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 11.5px; color: var(--text-mid); margin-bottom: 5px; }
  input, textarea, select {
    width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--card-border);
    border-radius: var(--radius); padding: 9px 10px; font-size: 13.5px; font-family: 'IBM Plex Mono', monospace;
  }
  select { font-family: 'Space Grotesk', sans-serif; }
  textarea { font-family: 'Space Grotesk', sans-serif; resize: vertical; min-height: 60px; }
  .modal-foot { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-top: 1px solid var(--hairline); }
  .seg { display: flex; border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; }
  .seg button { flex: 1; background: var(--card); border: none; padding: 9px; font-size: 13px; color: var(--text-mid); }
  .seg button.active.long { background: var(--green-dim); color: var(--green); }
  .seg button.active.short { background: var(--red-dim); color: #e08770; }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-mid); }
  .checkline input[type=checkbox] { width: auto; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--card-border); color: var(--text);
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .hint { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  .section-title { font-size: 11px; color: var(--text-dim); margin: 18px 0 10px; text-transform: uppercase; letter-spacing: 0.07em; }
  .section-title:first-child { margin-top: 0; }

  /* ---- Congrats modal ---- */
  .congrats-backdrop {
    position: fixed; inset: 0; background: rgba(6,6,7,0.78); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px; overflow: hidden;
  }
  .congrats-card {
    position: relative; background: linear-gradient(165deg, #1d1e22, var(--bg-alt));
    border: 1px solid var(--amber-dim); border-radius: 8px; max-width: 420px; width: 100%;
    padding: 38px 30px 30px; text-align: center; box-shadow: 0 0 0 1px rgba(212,162,76,0.12), 0 30px 70px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .congrats-icon { font-size: 42px; margin-bottom: 14px; }
  .congrats-title { font-size: 22px; font-weight: 700; margin: 0 0 10px; background: linear-gradient(120deg, #f3d9a4, var(--amber) 65%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .congrats-body { font-size: 13.5px; color: var(--text-mid); line-height: 1.6; margin: 0 0 22px; }
  .congrats-stats { display: flex; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; }
  .congrats-stats div { flex: 1; background: var(--card); padding: 12px 10px; }
  .congrats-stats .k { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .congrats-stats .v { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; }
  .confetti-piece { position: absolute; top: -12px; width: 7px; height: 13px; border-radius: 2px; opacity: 0.95; animation: confetti-fall 2.4s ease-in forwards; z-index: 1; }
  @keyframes confetti-fall { to { transform: translateY(420px) rotate(420deg); opacity: 0; } }

  /* ---- Check-in ---- */
  .checkin-scale { display: flex; gap: 6px; margin: 14px 0 6px; }
  .checkin-btn {
    flex: 1; aspect-ratio: 1; min-width: 0; border-radius: var(--radius); border: 1px solid var(--card-border);
    background: var(--card); color: var(--text-mid); font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
    transition: all .12s ease;
  }
  .checkin-btn:hover { border-color: var(--amber-dim); color: var(--text); }
  .checkin-btn.selected { background: linear-gradient(160deg, #e3ba71, var(--amber)); color: #1c1508; border-color: var(--amber); }

  const fmt = (n, d=2) => Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  const fmtMoney = (n, ccy='$') => (n<0? '-':'') + ccy + fmt(Math.abs(n));
  const dateToLocalISO = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayISO = () => dateToLocalISO(new Date());
  function getWeekRange(){
    const now = new Date();
    const dayIdx = (now.getDay()+6)%7; // days since Monday
    const monday = new Date(now); monday.setDate(now.getDate()-dayIdx);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return { start: dateToLocalISO(monday), end: dateToLocalISO(sunday) };
  }

  async function loadAll(){
    try { const a = await window.storage.get('tally:accounts'); accounts = a ? JSON.parse(a.value) : []; } catch(e){ accounts = []; }
    try { const tr = await window.storage.get('tally:trades'); trades = tr ? JSON.parse(tr.value) : []; } catch(e){ trades = []; }
    try { const s = await window.storage.get('tally:strategies'); strategies = s ? JSON.parse(s.value) : []; } catch(e){ strategies = []; }
    try { const i = await window.storage.get('tally:indicators'); indicators = i ? JSON.parse(i.value) : []; } catch(e){ indicators = []; }
    try { const ck = await window.storage.get('tally:checkins'); checkins = ck ? JSON.parse(ck.value) : []; } catch(e){ checkins = []; }
    try { const c = await window.storage.get('tally:current'); currentAccountId = c ? JSON.parse(c.value) : null; } catch(e){ currentAccountId = null; }
    try { const st = await window.storage.get('tally:settings'); const parsed = st ? JSON.parse(st.value) : null; lang = (parsed && parsed.lang) || 'en'; } catch(e){ lang = 'en'; }
  }

  function showConfirm(message, confirmLabel){
    return new Promise(resolve => {
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.style.zIndex = '150';
      backdrop.innerHTML = `
        <div class="modal" style="max-width:380px;">
          <div class="modal-body" style="padding-top:24px;">
            <p style="margin:0; font-size:13.5px; color:var(--text); line-height:1.6;">${message}</p>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" id="confirmNo">${t('btn_cancel')}</button>
            <button class="btn btn-danger" id="confirmYes" style="border-color:var(--card-border);">${confirmLabel || t('btn_yes_delete')}</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const finish = (val) => { backdrop.remove(); resolve(val); };
      $('#confirmNo', backdrop).onclick = () => finish(false);
      $('#confirmYes', backdrop).onclick = () => finish(true);
      backdrop.addEventListener('click', e => { if (e.target === backdrop) finish(false); });
    });
  }

  function tradePhaseTag(x, acc){
    if (!acc.phaseStartAt) return '';
    return x.createdAt < acc.phaseStartAt
      ? `<span class="tag-eval">${t('eval_tag')}</span>`
      : `<span class="tag-funded">${t('funded_tag')}</span>`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ---------- derived data ----------
  function accountTrades(accId){
    return trades.filter(x => x.accountId === accId).sort((a,b)=> a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
  }

  function computeStats(acc){
    const allTr = accountTrades(acc.id);
    const hasPhaseSplit = !!acc.phaseStartAt;
    const tr = hasPhaseSplit ? allTr.filter(x => x.createdAt >= acc.phaseStartAt) : allTr;
    const evalTr = hasPhaseSplit ? allTr.filter(x => x.createdAt < acc.phaseStartAt) : [];
    const evalProfit = evalTr.reduce((s,x)=>s+Number(x.pnl),0);
    let balance = acc.startingBalance;
    let peak = acc.startingBalance;
    let maxDD = 0;
    const target = Number(acc.profitTargetDollar) || 0;
    const targetAbs = acc.startingBalance + target;
    let targetReachedDate = null;
    const curve = [{x: 'start', y: balance}];
    tr.forEach(x => {
      balance += Number(x.pnl);
      if (balance > peak) peak = balance;
      const dd = peak - balance;
      if (dd > maxDD) maxDD = dd;
      if (targetReachedDate === null && target > 0 && balance >= targetAbs) targetReachedDate = x.date;
      curve.push({x: x.date, y: balance});
    });
    const wins = tr.filter(x => x.pnl > 0);
    const losses = tr.filter(x => x.pnl < 0);
    const grossWin = wins.reduce((s,x)=>s+x.pnl,0);
    const grossLoss = Math.abs(losses.reduce((s,x)=>s+x.pnl,0));
    const winRate = tr.length ? (wins.length/tr.length*100) : 0;
    const avgWin = wins.length ? grossWin/wins.length : 0;
    const avgLoss = losses.length ? grossLoss/losses.length : 0;
    const profitFactor = grossLoss > 0 ? grossWin/grossLoss : (grossWin>0 ? Infinity : 0);
    const expectancy = tr.length ? (tr.reduce((s,x)=>s+Number(x.pnl),0)/tr.length) : 0;
    const rValues = tr.filter(x => x.r !== null && x.r !== undefined && x.r !== '').map(x=>Number(x.r));
    const avgR = rValues.length ? rValues.reduce((a,b)=>a+b,0)/rValues.length : null;

    const today = todayISO();
    const todaysTrades = tr.filter(x => x.date === today);
    const dailyPnl = todaysTrades.reduce((s,x)=>s+Number(x.pnl),0);
    const dailyLossLimitAbs = Number(acc.dailyLossLimitDollar) || 0;
    const dailyLossUsedPct = dailyLossLimitAbs > 0 ? Math.min(100, Math.max(0, (-dailyPnl/dailyLossLimitAbs)*100)) : 0;

    const maxDDLimitAbs = Number(acc.maxDrawdownDollar) || 0;
    const currentDD = peak - balance;
    const ddUsedPct = maxDDLimitAbs > 0 ? Math.min(100, Math.max(0, (currentDD/maxDDLimitAbs)*100)) : 0;

    // consistency rule: max share of total profit that a single day may represent
    const byDay = {};
    tr.forEach(x => { byDay[x.date] = (byDay[x.date]||0) + Number(x.pnl); });
    let totalPositiveDaysProfit = 0, bestDayProfit = 0, bestDayDate = null;
    Object.keys(byDay).forEach(d => {
      const v = byDay[d];
      if (v > 0) totalPositiveDaysProfit += v;
      if (v > bestDayProfit){ bestDayProfit = v; bestDayDate = d; }
    });
    const consistencyRulePct = Number(acc.phase === 'funded' ? (acc.fundedConsistencyRulePct ?? 0) : acc.consistencyRulePct) || 0;
    const consistencyPct = totalPositiveDaysProfit > 0 ? (bestDayProfit/totalPositiveDaysProfit*100) : 0;
    const consistencyUsedPct = consistencyRulePct > 0 ? Math.min(100, Math.max(0, (consistencyPct/consistencyRulePct)*100)) : 0;
    const consistencyBreached = consistencyRulePct > 0 && (consistencyPct - consistencyRulePct) > 0.05;

    const profitProgress = balance - acc.startingBalance;
    const targetPct = target > 0 ? Math.min(100, Math.max(0, (profitProgress/target)*100)) : 0;

    let streak = 0, streakType = null;
    for (let i = tr.length-1; i >= 0; i--){
      const isWin = tr[i].pnl > 0;
      if (streakType === null){ streakType = isWin; streak = 1; }
      else if (isWin === streakType){ streak++; }
      else break;
    }

    const accCheckins = checkins.filter(c => c.accountId === acc.id && typeof c.score === 'number');
    const avgCheckinScore = accCheckins.length ? accCheckins.reduce((s,c)=>s+c.score,0)/accCheckins.length : null;
    const checkinCount = accCheckins.length;

    return {
      tr, balance, peak, maxDD, curve, winRate, avgWin, avgLoss, profitFactor, expectancy,
      avgR, dailyPnl, dailyLossLimitAbs, dailyLossUsedPct, maxDDLimitAbs, currentDD, ddUsedPct,
      target, profitProgress, targetPct, targetReachedDate, streak, streakType, wins, losses,
      consistencyRulePct, consistencyPct, consistencyUsedPct, consistencyBreached, bestDayProfit, bestDayDate, totalPositiveDaysProfit,
      hasPhaseSplit, evalProfit, evalTradeCount: evalTr.length,
      avgCheckinScore, checkinCount
    };
  }

    if (next) next.onclick = () => { calMonth.setMonth(calMonth.getMonth()+1); refreshCalendar(acc); };
    if (todayBtn) todayBtn.onclick = () => { calMonth = new Date(); calMonth.setDate(1); refreshCalendar(acc); };

  }
  function refreshCalendar(acc){

  function wireCalendarCells(acc){

  function localeFor(){ return lang==='es' ? 'es-ES' : lang==='nl' ? 'nl-NL' : 'en-US'; }

  function renderCalendarHead(acc){
    const monthLabel = calMonth.toLocaleDateString(localeFor(), {month:'long', year:'numeric'});
    const tr = accountTrades(acc.id);
    const ym = `${calMonth.getFullYear()}-${String(calMonth.getMonth()+1).padStart(2,'0')}`;
    const monthTotal = tr.filter(x => x.date.startsWith(ym)).reduce((s,x)=>s+Number(x.pnl),0);
    return `<div class="cal-head">
      <div class="cal-nav">
        <button class="cal-navbtn" id="calPrev">‹</button>
        <span class="cal-month-label">${monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1)}</span>
        <button class="cal-navbtn" id="calNext">›</button>
        <button class="btn btn-ghost" id="calTodayBtn" style="padding:5px 10px; font-size:11.5px;">${t('cal_today')}</button>
      </div>
      <div class="cal-summary ${monthTotal>=0?'pos':'neg'}">${t('cal_month_total')}: ${monthTotal>=0?'+':''}${fmtMoney(monthTotal, acc.currency)}</div>
    </div>`;
  }

  function renderCalendarGrid(acc){
    const year = calMonth.getFullYear(), month = calMonth.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7; // Monday-first
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const tr = accountTrades(acc.id);
    const byDay = {};
    tr.forEach(x => { (byDay[x.date] = byDay[x.date] || []).push(x); });
    const weekdayFmt = new Intl.DateTimeFormat(localeFor(), {weekday:'short'});
    const refMonday = new Date(2024,0,1); // a Monday
    let weekdayHtml = '';
    for (let i=0;i<7;i++){ const d = new Date(refMonday); d.setDate(refMonday.getDate()+i); weekdayHtml += `<span>${weekdayFmt.format(d)}</span>`; }

    const todayStr = todayISO();
    let cells = '';
    for (let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
    for (let day=1; day<=daysInMonth; day++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const dayTrades = byDay[dateStr] || [];
      const total = dayTrades.reduce((s,x)=>s+Number(x.pnl),0);
      let cls = 'cal-cell';
      if (dateStr === todayStr) cls += ' today';
      if (dayTrades.length){ cls += total >= 0 ? ' win' : ' loss'; }
      let phaseBadge = '';
      if (acc.phaseStartAt && dayTrades.length){
        const hasEval = dayTrades.some(x => x.createdAt < acc.phaseStartAt);
        const hasFunded = dayTrades.some(x => x.createdAt >= acc.phaseStartAt);
        if (hasEval && hasFunded) phaseBadge = `<span class="cal-phase-tag mixed">${t('mixed_tag')}</span>`;
        else if (hasEval) phaseBadge = `<span class="cal-phase-tag eval">${t('eval_tag')}</span>`;
        else phaseBadge = `<span class="cal-phase-tag funded">${t('funded_tag')}</span>`;
      }
      const ck = getCheckin(acc.id, dateStr);
      const checkinBadge = (ck && typeof ck.score === 'number') ? `<span class="cal-checkin-badge" style="background:transparent;">${checkinEmoji(ck.score)}</span>` : '';
      cells += `<div class="${cls}" data-date="${dateStr}">
        ${phaseBadge}
        <div class="cal-daynum">${day}</div>
        ${dayTrades.length? `<div class="cal-pnl">${calMoney(total, acc.currency)}</div>` : ''}
        ${dayTrades.length>1? `<div class="cal-count">${dayTrades.length}×</div>` : ''}
        ${checkinBadge}
      </div>`;
    }
    return `<div class="cal-weekdays">${weekdayHtml}</div><div class="cal-grid">${cells}</div>`;
  }

  function openDayModal(dateStr, acc){

          <button class="btn btn-primary" id="addDayTradeBtn">${t('btn_add_trade_day')}</button>
        </div>

    });
    $$('.day-del-trade', backdrop).forEach(btn => {

  function strategyFilterOptions(acc){
    const used = Array.from(new Set(accountTrades(acc.id).map(tradeStrategyName).filter(Boolean)));
    let html = `<option value="all">${t('filter_all_strategies')}</option>`;

  function renderWeekSummary(acc, s){
    const { start, end } = getWeekRange();
    const weekTrades = s.tr.filter(x => x.date >= start && x.date <= end);
    if (!weekTrades.length){
      return `<div class="week-summary"><span>${t('week_summary_label')}</span><span>· ${t('week_summary_none')}</span></div>`;
    }
    const total = weekTrades.reduce((sum,x)=>sum+Number(x.pnl),0);
    const wins = weekTrades.filter(x=>x.pnl>0).length;
    const winRate = wins/weekTrades.length*100;
    return `<div class="week-summary">
      <span>${t('week_summary_label')}</span>
      <b class="${total>=0?'pos':'neg'}">${total>=0?'+':''}${fmtMoney(total, acc.currency)}</b>
      <span>${weekTrades.length === 1 ? t('week_summary_trade_one') : t('week_summary_trades', {count: weekTrades.length})}</span>

  function renderChart(curve, startBalance){
    if (curve.length < 2) return `<div style="padding:40px 0;text-align:center;color:var(--text-dim);font-size:13px;">${t('chart_empty')}</div>`;
    const w = 1000, h = 170, padL = 46, padR = 10, padT = 14, padB = 20;
    const ys = curve.map(p=>p.y);
    const min = Math.min(...ys, startBalance), max = Math.max(...ys, startBalance);
    const range = (max-min) || 1;
    const stepX = (w - padL - padR) / (curve.length - 1);
    const xAt = i => padL + i*stepX;
    const yAt = v => padT + (h-padT-padB) * (1 - (v-min)/range);
    const pts = curve.map((p,i)=>`${xAt(i)},${yAt(p.y)}`).join(' ');
    const last = curve[curve.length-1].y;
    const lineColor = last >= startBalance ? '#5aa579' : '#c1553d';
    const zeroY = yAt(startBalance);
    const areaPts = `${padL},${zeroY} ${pts} ${xAt(curve.length-1)},${zeroY}`;
    let grid = '';
    for (let i=0;i<=3;i++){
      const gy = padT + (h-padT-padB)*i/3;
      grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#26272c" stroke-width="1"/>`;
    }
    return `<svg id="equityChart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}
      <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#54524a" stroke-width="1" stroke-dasharray="3,3"/>
      <polygon points="${areaPts}" fill="url(#areaGrad)"/>
      <polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="2"/>
      <text x="${padL}" y="12" fill="#6f6e73" font-size="10" font-family="IBM Plex Mono">${fmt(max,0)}</text>
      <text x="${padL}" y="${h-8}" fill="#6f6e73" font-size="10" font-family="IBM Plex Mono">${fmt(min,0)}</text>
    </svg>`;
  }

        ${st === 'deviated' ? `<div class="hint" style="margin-top:10px">${t('plan_which')}</div><div class="plan-rules">${list.map((r, i) => `<label class="plan-rule"><input type="checkbox" data-ri="${i}" ${r.ok ? 'checked' : ''}><span>${escapeHtml(r.text)}</span></label>`).join('')}</div>
          <div class="hint" style="margin-top:8px">${t('plan_reason')}</div><div class="plan-chips">${chips}</div>
          <input type="text" id="plan_reason_txt" maxlength="${REASON_MAX}" placeholder="${t('plan_r_ph')}" value="${escapeHtml(planSt.reasonKey && planSt.reasonKey !== 'other' ? '' : (planSt.reason || ''))}">` : ''}</div>`;
      $$('[data-plan]', box).forEach(b => b.onclick = () => {
        const v = b.dataset.plan; planTouched = true;
        if (v === 'skip') planSt = null;
        else if (!active) planSt = { status: v, rules: rules.map(r => ({ id: r.id, text: r.text, ok: true })), reasonKey: '', reason: '', stratId: strat.id };
        else planSt.status = v;
        drawPlan();
      });
      $$('[data-ri]', box).forEach(c => c.onchange = () => { planTouched = true; planSt.rules[Number(c.dataset.ri)].ok = c.checked; });
      const txt = $('#plan_reason_txt', box), sync = () => $$('.plan-chip', box).forEach(c => c.classList.toggle('on', c.dataset.reason === planSt.reasonKey));
      $$('[data-reason]', box).forEach(c => c.onclick = () => {
        planTouched = true; const k = c.dataset.reason;
        if (planSt.reasonKey === k){ planSt.reasonKey = ''; planSt.reason = ''; if (txt) txt.value = ''; }
        else { planSt.reasonKey = k; planSt.reason = k === 'other' ? cleanLine(txt.value, REASON_MAX) : t(PLAN_REASONS.find(r => r[0] === k)[1]); if (k !== 'other') txt.value = ''; else txt.focus(); }
        sync();
      });
      if (txt) txt.oninput = () => { planTouched = true; const v = cleanLine(txt.value, REASON_MAX); planSt.reason = v; planSt.reasonKey = v ? 'other' : ''; sync(); };
    };
    $('#f_strategy', backdrop).addEventListener('input', () => {
      const ns = stratOf($('#f_strategy', backdrop).value);
      if (ns && planSt && planSt.stratId !== ns.id){ planSt = null; planTouched = true; }
      strat = ns; drawPlan();
    });
    drawPlan();

    // ----- confidence (optional smiley) -----
    let confidence = (x && [1,2,3].includes(x.confidence)) ? x.confidence : null;
    const syncConf = () => $$('.conf-btn', backdrop).forEach(b => b.classList.toggle('selected', Number(b.dataset.conf) === confidence));
    $$('.conf-btn', backdrop).forEach(b => {
      b.onclick = () => { const v = Number(b.dataset.conf); confidence = (confidence === v) ? null : v; syncConf(); };
    });
    syncConf();

    // ----- screenshots -----
    let imgIds = (x && Array.isArray(x.images)) ? x.images.slice() : [];
    const pendingNew = {};      // id -> dataUrl (added in this modal, not stored yet)
    const removedStored = [];   // stored ids the user removed in this modal
    const thumbSrc = {};        // id -> dataUrl for display
    const thumbsEl = $('#thumbs', backdrop);
    const addBtn = $('#addPhotoBtn', backdrop);
    const fileInput = $('#photoInput', backdrop);

    function renderThumbs(){
      thumbsEl.innerHTML = '';
      imgIds.forEach(iid => {
        const wrap = document.createElement('div'); wrap.className = 'thumb';
        const im = document.createElement('img'); im.alt = '';
        if (thumbSrc[iid]) im.src = thumbSrc[iid];
        im.onclick = () => { if (thumbSrc[iid]) openLightbox(thumbSrc[iid]); };
        const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'thumb-x'; rm.textContent = '✕';
        rm.setAttribute('aria-label', t('btn_delete'));
        rm.onclick = () => {
          imgIds = imgIds.filter(v => v !== iid);
          if (pendingNew[iid]) delete pendingNew[iid]; else removedStored.push(iid);
          renderThumbs();
        };
        wrap.appendChild(im); wrap.appendChild(rm); thumbsEl.appendChild(wrap);
      });
      addBtn.style.display = imgIds.length >= MAX_IMAGES ? 'none' : '';
    }
    async function addFiles(files){
      for (const f of files){
        if (imgIds.length >= MAX_IMAGES){ showToast(t('toast_photo_limit', {max: MAX_IMAGES})); break; }
        try {
          const dataUrl = await compressImage(f);
          const iid = 'i' + uid();
          pendingNew[iid] = dataUrl; thumbSrc[iid] = dataUrl; imgIds.push(iid);
        } catch(e){ showToast(t('toast_photo_fail')); }
      }
      renderThumbs();
    }
    renderThumbs();
    imgIds.forEach(async iid => {
      const src = await imgGet(iid);
      if (src){ thumbSrc[iid] = src; if (backdrop.isConnected) renderThumbs(); }
    });
    addBtn.onclick = () => fileInput.click();
    fileInput.onchange = () => { const files = Array.from(fileInput.files || []); fileInput.value = ''; addFiles(files); };
    const onPaste = (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      const files = [];
      for (const it of items){
        if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0){ const f = it.getAsFile(); if (f) files.push(f); }
      }
      if (files.length){ e.preventDefault(); addFiles(files); }
    };
    document.addEventListener('paste', onPaste);

    const close = () => { document.removeEventListener('paste', onPaste); backdrop.remove(); };
    $('#closeModal', backdrop).onclick = close;
    $('#cancelBtn', backdrop).onclick = close;
    backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
    if (x) $('#deleteBtn', backdrop).onclick = () => { close(); deleteTrade(x.id); };

    $('#saveTradeBtn', backdrop).onclick = async () => {
      const date = $('#f_date', backdrop).value;
      const symbol = $('#f_symbol', backdrop).value.trim();
      const entry = $('#f_entry', backdrop).value;
      const exit = $('#f_exit', backdrop).value;
      const size = $('#f_size', backdrop).value;
      let pnl = $('#f_pnl', backdrop).value;
      const r = $('#f_r', backdrop).value;
      const strategy = $('#f_strategy', backdrop).value.trim();
      const stratNow = stratOf(strategy);
      const emotion = $('#f_emotion', backdrop).value.trim();
      const notes = $('#f_notes', backdrop).value.trim();

      if (!date || !symbol){ showToast(t('toast_min_fields')); return; }
      if (pnl === '' && entry !== '' && exit !== '' && size !== ''){
        const e = Number(entry), ex = Number(exit), sz = Number(size);
        pnl = selectedDir === 'long' ? (ex-e)*sz : (e-ex)*sz;
      }
      if (pnl === '' || isNaN(Number(pnl))){ showToast(t('toast_pnl_needed')); return; }

      $('#saveTradeBtn', backdrop).disabled = true;
      const finalIds = [];
      for (const iid of imgIds){
        if (pendingNew[iid]){
          try { await imgPut(iid, pendingNew[iid]); finalIds.push(iid); }
          catch(e){ showToast(t('toast_photo_save_fail')); }
        } else { finalIds.push(iid); }
      }
      for (const rid of removedStored){ await imgDel(rid); }

      const record = {
        ...(x || {}),
        id: x ? x.id : uid(), accountId: currentAccountId,
        date, symbol, direction: selectedDir,
        entry: entry===''? null : Number(entry),
        exit: exit===''? null : Number(exit),
        size: size===''? null : Number(size),
        pnl: Number(pnl), r: r===''? null : Number(r),
        strategy: stratNow ? stratNow.title : strategy, emotion, notes,
        confidence, images: finalIds,
        createdAt: x ? x.createdAt : Date.now()
      };
      // optional strategy link + plan checklist; legacy trades without them are saved exactly as before
      // an unchanged strategy field keeps its link and plan even if that strategy was deleted or renamed later (history stays as recorded)
      const stratSame = !!x && normText(strategy) === normText(tradeStrategyName(x));
      if (stratNow) record.strategyId = stratNow.id; else if (!(stratSame && x.strategyId)) delete record.strategyId;
      if (planTouched){
        if (planSt && stratNow && planSt.stratId === stratNow.id) record.plan = buildPlan(planSt); else delete record.plan;
      } else if (x && x.plan && !stratSame && (!stratNow || stratNow.id !== x.strategyId)) delete record.plan;
      const acc = accounts.find(a=>a.id===currentAccountId);
      const prevAllGreen = allChecksGreen(computeStats(acc));
      trades = x ? trades.map(v => v.id===x.id ? record : v) : [...trades, record];
      await saveTrades();
      const newStats = computeStats(acc);
      close(); render();
      showToast(x? t('toast_trade_updated') : t('toast_trade_logged'));
      if (!prevAllGreen && allChecksGreen(newStats)){
        showCongratsModal(acc, newStats);
      }
    };
  }

      $$('[data-rx]', backdrop).forEach(b => b.onclick = () => { rules.splice(Number(b.dataset.rx), 1); drawRules(); });

      await saveStrategies(); close(); render();

  // ================= IMAGES (screenshots) =================
  const MAX_IMAGES = 6;
  let _idb = null;
  function idbOpen(){
    if (_idb) return _idb;
    const pr = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open('tally-images', 1);
        req.onupgradeneeded = () => { req.result.createObjectStore('img'); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('idb error'));
        req.onblocked = () => reject(new Error('idb blocked'));
      } catch(e){ reject(e); }
    });
    _idb = pr;
    pr.catch(() => { if (_idb === pr) _idb = null; });
    return pr;
  }
  async function idbRun(mode, fn){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('img', mode);
      let req;
      try { req = fn(tx.objectStore('img')); } catch(e){ reject(e); return; }
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('aborted'));
    });
  }
  // IndexedDB first (large quota); falls back to window.storage if it is unavailable.
  async function imgPutLocal(id, dataUrl){
    try { await idbRun('readwrite', st => st.put(dataUrl, id)); return; } catch(e){}
    await window.storage.set('tally:img:' + id, dataUrl);
  }
  async function imgGetLocal(id){
    try { const v = await idbRun('readonly', st => st.get(id)); if (v) return v; } catch(e){}
    try { const r = await window.storage.get('tally:img:' + id); return r ? r.value : null; } catch(e){ return null; }
  }
  async function imgDelLocal(id){
    try { await idbRun('readwrite', st => st.delete(id)); } catch(e){}
    try { if (window.storage.delete) await window.storage.delete('tally:img:' + id); } catch(e){}
  }
  // these also talk to the cloud when the user is logged in
  async function imgPut(id, dataUrl){ await imgPutLocal(id, dataUrl); cloudSchedule(); }
  async function imgGet(id){ const v = await imgGetLocal(id); return v || cloudFetchImage(id); }
  async function imgDel(id){ await imgDelLocal(id); cloudDeleteImage(id); }
  function collectImageIds(list){
    const ids = [];
    list.forEach(x => (Array.isArray(x.images) ? x.images : []).forEach(i => ids.push(i)));
    return ids;
  }
  async function deleteTradeImages(list){

  // Resize + recompress a screenshot so it stays small (about 100-300 KB)
  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 1600; quality = quality || 0.72;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error || new Error('read'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode'));
        img.onload = () => {
          try {
            let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            if (!w || !h) throw new Error('size');
            const scale = Math.min(1, maxDim / Math.max(w, h));
            w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', quality));
          } catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ================= CHECKLIST (plan adherence, optional) =================
  // Stored inside the existing records: strategy.rules = [{id,text}], trade.strategyId, trade.plan = {status, rules:[{id,text,ok}], reason?, reasonKey?, at}.
  // trade.strategy (free text) is never removed: it stays as label and fallback.
  const MAX_RULES = 12, RULE_MAX = 80, REASON_MAX = 60;
  const PLAN_REASONS = [['early', 'plan_r_early'], ['fomo', 'plan_r_fomo'], ['sl_moved', 'plan_r_sl'], ['other', 'plan_r_other']];
  const STARTER_RULES = ['rule_s1', 'rule_s2', 'rule_s3', 'rule_s4', 'rule_s5'];
  const normText = v => String(v == null ? '' : v).trim().replace(/\s+/g, ' ').toLowerCase();
  const cleanLine = (v, max) => String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
  function cleanRules(list){
    if (!Array.isArray(list)) return [];
    const out = [], seen = {};
    list.forEach(r => {
      if (!r || typeof r !== 'object') return;
      const text = cleanLine(r.text, RULE_MAX); if (!text) return;
      let id = String(r.id == null ? '' : r.id); if (!/^[A-Za-z0-9_-]{1,32}$/.test(id) || seen[id]) id = uid();
      seen[id] = 1; out.push({ id, text });
    });
    return out.slice(0, MAX_RULES);
  }
  const strategyFor = tr => (tr && tr.strategyId && strategies.find(s => s && s.id === tr.strategyId)) || null;
  const tradeStrategyName = tr => { const s = strategyFor(tr); return (s && s.title) || (tr && tr.strategy) || ''; };
  function matchStrategyByText(text){
    const n = normText(text); if (!n) return null;
    const m = strategies.filter(s => s && normText(s.title) === n);
    return m.length === 1 ? m[0] : null;   // ambiguous or unknown: stay free text
  }
  function readPlan(tr){   // defensive: anything malformed counts as "not answered"
    const p = tr && tr.plan;
    if (!p || typeof p !== 'object' || (p.status !== 'followed' && p.status !== 'deviated')) return null;
    const rules = Array.isArray(p.rules) ? p.rules.filter(r => r && typeof r.text === 'string' && typeof r.ok === 'boolean').map(r => ({ id: String(r.id || ''), text: r.text, ok: r.ok })) : [];
    return { status: p.status, rules, reason: typeof p.reason === 'string' ? p.reason : '', reasonKey: typeof p.reasonKey === 'string' ? p.reasonKey : '', at: +p.at || 0 };
  }
  // follow-the-rules vs. outcome are kept apart: followed/deviated x win/loss/break-even (null when not answered or no numeric result)
  function planQuadrant(tr){
    const p = readPlan(tr); if (!p) return null;
    const n = Number(tr.pnl); if (tr.pnl === null || tr.pnl === undefined || tr.pnl === '' || !isFinite(n)) return null;
    return p.status + '_' + (n > 0 ? 'win' : n < 0 ? 'loss' : 'be');
  }
  function buildPlan(ps){
    const followed = ps.status === 'followed';
    const p = { status: ps.status, rules: ps.rules.map(r => ({ id: r.id, text: r.text, ok: followed ? true : !!r.ok })), at: Date.now() };
    if (!followed){
      const reason = cleanLine(ps.reason, REASON_MAX);
      if (reason){ p.reason = reason; if (PLAN_REASONS.some(r => r[0] === ps.reasonKey)) p.reasonKey = ps.reasonKey; }
    }
    return p;
  }
  const rulesCountLabel = n => n === 1 ? t('plan_rules_1') : t('plan_rules_n', { n });

  function confEmoji(c){ return ({1:'😞', 2:'😐', 3:'😄'})[c] || ''; }
  function tradeMeta(x){
    let m = '';
    if (confEmoji(x.confidence)) m += `<span class="tmeta" title="${t('lbl_confidence_short')}">${confEmoji(x.confidence)}</span>`;
    { const pl = readPlan(x); if (pl) m += `<span class="tmeta ${pl.status === 'followed' ? 'plan-ok' : 'plan-dev'}" title="${t(pl.status === 'followed' ? 'plan_followed' : 'plan_deviated')}">${pl.status === 'followed' ? '✓' : '✗'}</span>`; }
    if (Array.isArray(x.images) && x.images.length) m += `<span class="tmeta" title="${t('lbl_screenshots')}">📷${x.images.length > 1 ? x.images.length : ''}</span>`;
    return m;
  }

  // "+$850" / "-$200"; compact ("$1.2k") on narrow phone screens
  function calMoney(total, ccy){
    const sign = total > 0 ? '+' : total < 0 ? '-' : '';
    const abs = Math.abs(total);
    let body;
    if (abs >= 1000 && window.innerWidth < 560){
      const k = abs / 1000;
      body = (k >= 10 ? Math.round(k) : Math.round(k * 10) / 10) + 'k';
    } else {
      body = fmt(abs, 0);
    }
    return sign + ccy + body;
  }

  async function restoreTradesWithImages(obj){
    await deleteTradeImages(trades); // screenshots of the data being replaced
    const imgMap = (obj.images && typeof obj.images === 'object') ? obj.images : {};
    const out = [];
    for (const x of obj.trades){
      const ids = Array.isArray(x.images) ? x.images.filter(id => typeof id === 'string' && typeof imgMap[id] === 'string' && imgMap[id].indexOf('data:image/') === 0) : [];
      const kept = [];
      for (const id of ids){
        try { await imgPut(id, imgMap[id]); kept.push(id); } catch(e){}
      }
      out.push({ ...x, images: kept });
    }
    return out;
  }

  function csvCell(v, isText){
    let str = (v === null || v === undefined) ? '' : String(v);
    if (isText && /^[=+\-@]/.test(str)) str = "'" + str;
    return '"' + str.replace(/"/g, '""') + '"';
  }

  function buildTradesCsv(){
    const head = ['Account','Type','Phase','Date','Symbol','Direction','Entry','Exit','Size','PnL','R','Strategy','Emotion','Notes','Confidence','Screenshots','Plan','Plan reason'];
    const lines = [head.map(h => csvCell(h)).join(',')];
    const sorted = trades.slice().sort((a,b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
    sorted.forEach(x => {
      const acc = accounts.find(a => a.id === x.accountId);
      if (!acc) return;
      const phase = acc.phaseStartAt ? (x.createdAt < acc.phaseStartAt ? 'Evaluation' : 'Funded') : (acc.phase === 'funded' ? 'Funded' : 'Evaluation');
      lines.push([
        csvCell(acc.name, true), csvCell(acc.isBacktest ? 'Backtest' : 'Live'), csvCell(phase),
        csvCell(x.date), csvCell(x.symbol, true), csvCell(x.direction),
        csvCell(x.entry), csvCell(x.exit), csvCell(x.size), csvCell(x.pnl), csvCell(x.r),
        csvCell(tradeStrategyName(x), true), csvCell(x.emotion, true), csvCell(x.notes, true),
        csvCell(({1:'Low', 2:'Medium', 3:'High'})[x.confidence] || ''), csvCell(Array.isArray(x.images) ? x.images.length : 0),
        csvCell((readPlan(x) || {}).status || ''), csvCell((readPlan(x) || {}).reason || '', true)
      ].join(','));
    });
    return '\uFEFF' + lines.join('\r\n');
  }

  // Try the platform save dialog (published page); fall back to a copy-paste window.
  async function offerFile(filename, data){
    let dl = null;
    try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch(e){ dl = null; }
    if (dl){
      try { await dl.save({ filename, data }); showToast(t('toast_export_saved')); return; }
      catch(e){ if (e && e.code === 'declined') return; }
    }
    // Phones (incl. the installed iOS app): open the share sheet so it can be saved to Files
    try {
      if (typeof File === 'function' && navigator.canShare && navigator.share){
        const file = new File([data], filename, { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' });
        if (navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: filename }); return; }
      }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    openCopyModal(filename, data);
  }

  async function cloudPush(){

      const list = KIND_ARR[kind].get(), seen = {};

        const key = kind + ':' + x.id; seen[key] = 1;

      });

    for (;;){
      let path = '/rest/v1/records?select=kind,id,data,deleted,updated_at&order=updated_at.asc,id.asc';
      if (since) path += '&updated_at=gt.' + encodeURIComponent(since);

        const a = KIND_ARR[rec.kind]; if (!a) return;
        if (!maxTs || Date.parse(rec.updated_at) > Date.parse(maxTs)) maxTs = rec.updated_at;
        const key = rec.kind + ':' + rec.id;
        const list = a.get(), idx = list.findIndex(x => x && String(x.id) === String(rec.id));

  function unlinkShared(postId){
    let ch = false;
    strategies = strategies.map(s => { if (s.sharedPostId === postId){ ch = true; const { sharedPostId, ...rest } = s; return rest; } return s; });
    if (ch) saveStrategies();
    ch = false;

  function postFromRecord(kind, r){
    if (kind === 'strategy'){
      const title = (r.title || '').trim(), body = (r.content || '').trim();
      if (!title || title.length > 120) return { err: t('share_err_title') };
      if (body.length > 5000) return { err: t('share_err_long') };
      return { post: { kind, title, body, payload: { tags: (r.tags || []).slice(0, 10).map(x => String(x).slice(0, 30)) } } };
    }
    const title = (r.name || '').trim(), body = (r.description || '').trim(), url = (r.url || '').trim();
    if (!title || title.length > 120) return { err: t('share_err_title') };
    if (!TV_URL_RE.test(url)) return { err: t('share_err_url') };
    if (body.length > 5000) return { err: t('share_err_long') };
    return { post: { kind, title, body, payload: { url, category: (r.category || '').slice(0, 40) } } };
  }
  // publish or update; resolves to the post id
  async function publishRecord(kind, rec){
    const { post, err } = postFromRecord(kind, rec);
    if (err){ showToast(err); return null; }
    if (rec.sharedPostId){
      const u = await cloudReq('PATCH', '/rest/v1/posts?id=eq.' + rec.sharedPostId, { body: { title: post.title, body: post.body, payload: post.payload }, headers: { Prefer: 'return=representation' } });
      if (u.ok && Array.isArray(u.data) && u.data.length) return rec.sharedPostId;
      if (!u.ok){ showToast(t('auth_err_generic')); return null; }
    }
    const r = await cloudReq('POST', '/rest/v1/posts', { body: Object.assign({ author_id: cloudSession.user_id }, post), headers: { Prefer: 'return=representation' } });
    if (!r.ok || !Array.isArray(r.data) || !r.data[0]){ showToast(t('auth_err_generic')); return null; }
    return r.data[0].id;
  }

    sb.onclick = async () => {
      sb.disabled = true;

      } catch(e){ showToast(e && e.offline ? t('auth_err_network') : t('auth_err_generic')); }

    let body;
    if (waiting) body = `<div class="home-stats">${[1, 2, 3, 4].map(() => '<div class="home-stat sk-tile"><div class="sk-line" style="width:40%;height:22px"></div><div class="sk-line" style="width:70%;margin-top:10px"></div></div>').join('')}</div>`;
    else if (empty) body = `<div class="home-empty"><p>${t('home_stats_empty')}</p><button class="btn btn-primary" id="homeFirst">${t('home_first_entry')}</button></div>`;
    else {
      const tiles = [
        ['journal', trades.length, t('home_s_entries'), accounts.length > 1 ? t('home_s_all_accounts') : ''],
        ['journal', inWeek.length, t('home_s_week'), ''],
        ['journal', days, t('home_s_days'), t('home_s_of7')],
        ['strategies', strategies.length, t('nav_strategies'), ''],
        ['indicators', indicators.length, t('nav_indicators'), '']
      ];
      if (cloudSession){
        const v = commOk ? String(home.posts) : commWait ? null : '–';
        tiles.push(['community', v, t('home_s_posts'), commOk && home.following != null ? t('home_s_following', { n: home.following }) : '']);
      }
      body = `<div class="home-stats">${tiles.map(([go, v, l, s]) => `<button class="home-stat" data-go="${go}">${v === null ? '<div class="sk-line" style="width:36%;height:22px"></div>' : `<span class="home-num">${v}</span>`}<span class="home-lbl">${escapeHtml(l)}</span>${s ? `<span class="home-sub">${escapeHtml(s)}</span>` : ''}</button>`).join('')}</div>`;
    }
    return `<section class="home-sec"><h2 class="home-h">${t('home_overview')}</h2>${body}</section>`;
  }
  function homeActivity(){
    const items = [];
    trades.forEach(x => { if (x) items.push({ k: 'journal', id: x.id, ts: +x.createdAt || 0, title: (x.symbol || '').trim() || t('home_entry'), meta: t('nav_journal') }); });
    strategies.forEach(x => { if (x) items.push({ k: 'strategies', id: x.id, ts: +x.createdAt || 0, title: (x.title || '').trim() || t('nav_strategies'), meta: t('home_k_strategy') }); });
    indicators.forEach(x => { if (x) items.push({ k: 'indicators', id: x.id, ts: +x.createdAt || 0, title: (x.name || '').trim() || t('nav_indicators'), meta: t('home_k_indicator') }); });
    items.sort((a, b) => b.ts - a.ts);
    const top = items.slice(0, 4);
    const waiting = !!cloudSession && !home.synced && !items.length;
    let body;
    if (waiting) body = '<div class="home-list">' + [1, 2].map(() => '<div class="home-item sk-tile"><div class="sk-line" style="width:50%"></div></div>').join('') + '</div>';
    else if (!top.length) body = `<div class="home-empty"><p>${t('home_act_empty')}</p><button class="btn btn-primary" id="homeFirst2">${t('home_first_entry')}</button></div>`;
    else body = `<div class="home-list">${top.map(i => `<button class="home-item" data-act="${i.k}" data-id="${escapeHtml(String(i.id))}"><span class="home-ico sm">${HOME_ICON[i.k]}</span><span class="home-item-t"><b>${escapeHtml(i.title)}</b><small>${escapeHtml(i.meta)}${i.ts > 0 ? ' · ' + escapeHtml(timeAgo(new Date(i.ts).toISOString())) : ''}</small></span></button>`).join('')}</div>`;
    return `<section class="home-sec"><div class="home-h-row"><h2 class="home-h">${t('home_activity')}</h2>${top.length ? `<button class="home-link" id="homeAll">${t('home_view_all')}</button>` : ''}</div>${body}</section>`;
  }
  function homeQuote(d){
    return `<section class="home-quoteCard" id="homeDaily"><div class="home-qh">${t('home_daily')}</div><p>${escapeHtml(dailyQuote(d))}</p></section>`;
  }
  function renderHome(){
    const main = $('#main'), d = new Date();
    const safe = fn => { try { return fn(d); } catch(e){ return ''; } };
    main.innerHTML = `<div class="home">${safe(homeHeader)}${safe(homeQuick)}${safe(homeStats)}${safe(homeActivity)}${safe(homeQuote)}</div>`;
    const me = cloudSession && cloudSession.user_id;
    const goProfile = () => { if (me) openProfile(me); else openAuthGate('login'); };
    ['homeAva', 'homeName', 'homeProfile'].forEach(id => { const el = $('#' + id); if (el) el.onclick = goProfile; });
    const lg = $('#homeLogin'); if (lg) lg.onclick = () => openAuthGate('login');
    $$('[data-go]', main).forEach(b => b.onclick = () => setSection(b.dataset.go, { fresh: true }));
    ['homeFirst', 'homeFirst2'].forEach(id => { const el = $('#' + id); if (el) el.onclick = () => $('#newTradeBtn').onclick(); });
    const all = $('#homeAll'); if (all) all.onclick = () => setSection('journal');
    $$('[data-act]', main).forEach(b => b.onclick = () => {
      const k = b.dataset.act, id = b.dataset.id;
      if (k === 'journal'){
        const x = trades.find(v => v.id === id);
        if (x && x.accountId && x.accountId !== currentAccountId && accounts.find(a => a.id === x.accountId)){ currentAccountId = x.accountId; saveCurrent(); }
        setSection('journal'); if (x) openTradeModal(id);
      } else if (k === 'strategies'){ setSection('strategies'); openStrategyModal(id); }
      else { setSection('indicators'); openIndicatorModal(id); }
    });
    homeRefresh();
  }
  $('#settingsBtn').onclick = () => openSettingsModal();
  $('#fabLog').onclick = () => $('#newTradeBtn').onclick();
  $$('.tab-btn').forEach(b => b.addEventListener('click', () => { if (b.dataset.section === 'community' && currentSection === 'community') feed.view = 'feed'; setSection(b.dataset.section); }));

  if (window.__TALLY_TEST__) Object.assign(window.__TALLY_TEST__, {
    st: () => ({ accounts, trades, strategies, indicators, checkins }),
    setTrades: v => { trades = v; }, setStrategies: v => { strategies = v; }, setIndicators: v => { indicators = v; }, saveIndicators,
    saveTrades, saveStrategies, saveAccounts, cloudSync, imgPut, imgGet, imgDel, imgGetLocal,
    buildBackup, planQuadrant, readPlan, cleanRules, setCurrent: id => { currentAccountId = id; }, feedState: () => feed, session: () => cloudSession, meta: () => cloudMeta, status: () => cloudStatus
  });
  (async function init(){
    await loadAll();
    if (accounts.length && !currentAccountId) currentAccountId = accounts[0].id;
    await cloudLoadState();
    { const fc = await stGet('tally:feedcat'); if (FEED_KINDS.indexOf(fc) >= 0) feed.kind = fc; const fm = await stGet('tally:feedmode'); if (FEED_MODES.indexOf(fm) >= 0) feed.mode = fm; }
    try { history.replaceState({ tallySec: 'home' }, ''); } catch(e){}
    render();
    updateSyncUi();
    cloudStart();
    if (cloudSession){ cloudLoadProfile().then(() => updateSyncUi()); cloudSync(); }
    else if ((await stGet('tally:cloudmode')) !== 'local') openAuthGate('login');
  })();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
